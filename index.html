const LANGS=['en','de','tr','es'];
let lang=(()=>{ const q=new URLSearchParams(location.search).get('lang'); if(q&&LANGS.includes(q.toLowerCase())) return q.toLowerCase();
  try{ const s=localStorage.getItem('lang'); if(LANGS.includes(s)) return s; }catch(e){}
  const n=(navigator.language||'en').slice(0,2).toLowerCase(); return LANGS.includes(n)?n:'en'; })();
let L=I18N[lang];
const stage=document.getElementById('stage'), dots=document.getElementById('dots'), langsEl=document.getElementById('langs');
let SCREENS=[];
function build(){
  L=I18N[lang]; document.documentElement.lang=lang==='es'?'es-419':lang;
  SCREENS=[{id:'start',nav:L.ui.navStart},...ERAS.map(e=>({id:e.id,nav:L.nav[e.id],era:e})),{id:'contact',nav:L.ui.navContact}];
  stage.innerHTML=''; dots.innerHTML='';
  SCREENS.forEach((sc,idx)=>{
    const s=document.createElement('section'); s.className='screen'; s.id=sc.id; s.hidden=idx!==cur;
    if(sc.id==='start'){
      s.innerHTML=`<canvas class="scene" width="768" height="432" data-scene="intro" role="img" aria-label="Keremcan, player 1"></canvas>
      <h1>Keremcan Çakar</h1><p class="tagline">${L.ui.tagline}</p><p class="tagline intro-only">${L.ui.hint}</p>`;
    } else if(sc.id==='contact'){
      s.className='screen contact';
      s.innerHTML=`<canvas class="scene" width="768" height="432" data-scene="finale" role="img" aria-label="High scores"></canvas>
      <div class="era-head"><h2>${L.ui.contactTitle}</h2><span class="when">${L.ui.contactWhen}</span></div>
      <p style="margin:0;max-width:62ch;color:var(--muted)">${L.ui.contactText}</p>

      <a class="btn" href="https://www.linkedin.com/in/kcakar" target="_blank" rel="noopener">LinkedIn</a></div>
      <h3 style="margin:14px 0 0;font-size:15px">${L.ui.jokesTitle}</h3><ul class="jokes">${L.ui.jokes.map(j=>`<li>${j}</li>`).join('')}</ul>`;
    } else {
      const e=sc.era, x=L.eras[e.id];

      <div class="era-head"><h2>${x.title}</h2><span class="when">${e.when.endsWith('–')?e.when+' '+L.ui.now:e.when}</span><span class="where">${x.where}</span></div>

    }
    stage.appendChild(s);

  });
  document.getElementById('back').textContent=L.ui.back; dots.setAttribute('aria-label',L.ui.levels);

  langsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

}
